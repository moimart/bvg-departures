[project]
name = "bvg-departures"
version = "0.1.0"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "TC"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR2004", "RUF001", "RUF002", "RUF003", "TC001", "TC002", "TC003"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["custom_components.bvg_departures"]
disallow_subclassing_any = false
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components.bvg_departures"]
